<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish — OchiqKitob Boshqaruv Tizimi</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .login-glow {
      box-shadow: 0 0 60px rgba(5,150,105,0.15), 0 25px 50px rgba(0,0,0,0.25);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .logo-float { animation: float 3s ease-in-out infinite; }
    .bg-pattern {
      background-color: #0f172a;
      background-image: radial-gradient(circle at 20% 50%, rgba(5,150,105,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(16,185,129,0.06) 0%, transparent 40%),
                        radial-gradient(circle at 60% 80%, rgba(52,211,153,0.04) 0%, transparent 40%);
    }
    .input-field {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      transition: all 0.3s;
    }
    .input-field:focus {
      background: rgba(255,255,255,0.1);
      border-color: #10b981;
      outline: none;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
    }
    .input-field::placeholder { color: rgba(255,255,255,0.3); }
    .shake { animation: shake 0.5s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body class="bg-pattern min-h-screen flex items-center justify-center p-4">

  <!-- Floating particles background -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-10 w-32 h-32 bg-emerald-500/5 rounded-full blur-xl"></div>
    <div class="absolute bottom-20 right-10 w-48 h-48 bg-emerald-400/5 rounded-full blur-2xl"></div>
    <div class="absolute top-1/2 left-1/3 w-24 h-24 bg-emerald-600/5 rounded-full blur-lg"></div>
  </div>

  <div class="w-full max-w-md relative">
    
    <!-- Card -->
    <div class="bg-slate-900 rounded-3xl p-8 login-glow border border-slate-800/80">
      
      <!-- Logo & Header -->
      <div class="text-center mb-8">
        <div class="logo-float inline-block mb-4">
          <img src="/images/logo.png" alt="OchiqKitob" class="w-28 h-28 mx-auto object-contain rounded-2xl bg-white/5 p-2">
        </div>
        <h1 class="text-2xl font-extrabold text-white mb-1">Kutubxona Boshqaruvi</h1>
        <p class="text-slate-400 text-sm">Davom etish uchun parolni kiriting</p>
      </div>

      <!-- Error Message -->
      <div id="errorMsg" class="hidden mb-5 p-3.5 bg-red-500/10 border border-red-500/30 rounded-xl flex items-center gap-3">
        <svg class="w-5 h-5 text-red-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span id="errorText" class="text-red-300 text-sm font-medium"></span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-5">

        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Maxfiy Parol</label>
          <div class="relative">
            <input 
              type="password" 
              id="passwordInput" 
              name="password"
              placeholder="••••••••••••"
              autocomplete="current-password"
              class="input-field w-full px-4 py-3.5 rounded-xl text-sm font-medium pr-12"
              required
            >
            <button type="button" id="togglePwd" class="absolute right-3.5 top-3.5 text-slate-500 hover:text-slate-300 transition-colors">
              <svg id="eyeIcon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="loginBtn"
          class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-bold rounded-xl text-sm shadow-lg shadow-emerald-900/40 transition-all duration-200 flex items-center justify-center gap-2"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          <span id="loginBtnText">Tizimga Kirish</span>
        </button>

      </form>

      <!-- Footer info -->
      <div class="mt-8 pt-6 border-t border-slate-800 text-center">
        <a href="/" class="text-xs text-slate-500 hover:text-emerald-400 transition-colors flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Jamoat saytiga qaytish
        </a>
      </div>
    </div>

    <!-- Marhum Chorshanbiyev xotirasiga -->
    <p class="text-center text-slate-600 text-xs mt-4 leading-relaxed px-4">
      Marhum Chorshanbiyev Bekmurod xotirasiga bag'ishlangan 🕊️
    </p>
  </div>

  <script>
    const ADMIN_SECRET_PATH = window.location.pathname.replace('/', '');

    // Password toggle
    document.getElementById('togglePwd').addEventListener('click', () => {
      const pwd = document.getElementById('passwordInput');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    });

    // Enter keypress
    document.getElementById('passwordInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('loginForm').requestSubmit();
    });

    // Login submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = document.getElementById('passwordInput').value;
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('loginBtnText');
      const errorDiv = document.getElementById('errorMsg');
      const errorText = document.getElementById('errorText');

      // Loading state
      btn.disabled = true;
      btnText.textContent = 'Tekshirilmoqda...';
      errorDiv.classList.add('hidden');

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const result = await res.json();

        if (result.success) {
          btnText.textContent = '✅ Kirdingiz! Yo\'naltirish...';
          btn.className = 'w-full py-3.5 bg-gradient-to-r from-green-600 to-green-500 text-white font-bold rounded-xl text-sm transition-all flex items-center justify-center gap-2';
          setTimeout(() => {
            window.location.href = result.redirectUrl || window.location.pathname + '/panel';
          }, 800);
        } else {
          // Shake & error
          document.getElementById('passwordInput').value = '';
          errorText.textContent = result.error || 'Noto\'g\'ri parol!';
          errorDiv.classList.remove('hidden');
          document.querySelector('.bg-slate-900').classList.add('shake');
          setTimeout(() => document.querySelector('.bg-slate-900').classList.remove('shake'), 600);

          btn.disabled = false;
          btnText.textContent = 'Tizimga Kirish';
        }
      } catch (err) {
        errorText.textContent = 'Tarmoq xatosi. Qaytadan urinib ko\'ring.';
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btnText.textContent = 'Tizimga Kirish';
      }
    });
  </script>
</body>
</html>
