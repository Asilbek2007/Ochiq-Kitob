<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filter for white sticker outline -->
    <filter id="sticker-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="6" in="SourceAlpha" result="thickened" />
      <feFlood flood-color="#ffffff" result="white" />
      <feComposite in="white" in2="thickened" operator="in" result="outline" />
      <feMerge>
        <feMergeNode in="outline" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
  </defs>

  <!-- Background Soft Gray Canvas -->
  <rect width="500" height="500" rx="32" fill="#e8eaed" />

  <!-- Main Calligraphic Artistic Emblem -->
  <g filter="url(#sticker-glow)" transform="translate(45, 60)">
    
    <!-- Word 1: "Ochiq" -->
    <g fill="none" stroke="url(#blueGrad)" stroke-linecap="round" stroke-linejoin="round">
      <!-- Letter O -->
      <path d="M125 75 C80 30, 20 80, 25 150 C30 210, 95 215, 120 160 C135 125, 125 60, 85 45 C45 30, 15 80, 20 145" stroke-width="15" />
      <!-- Letter ch -->
      <path d="M140 145 C155 120, 175 110, 195 125 C205 132, 210 150, 205 175 C200 200, 185 210, 165 205" stroke-width="13" />
      <!-- Letter h / i -->
      <path d="M195 70 L185 205 C185 205, 220 120, 245 125 C265 130, 270 165, 260 205" stroke-width="14" />
      <!-- Letter i dot & q -->
      <circle cx="280" cy="95" r="7" fill="#0284c7" stroke="none" />
      <path d="M280 125 L275 205 C275 205, 305 120, 340 125 C370 130, 365 185, 335 205 L315 285" stroke-width="14" />
    </g>

    <!-- Word 2: "Kitob" -->
    <g fill="none" stroke="url(#blueGrad)" stroke-linecap="round" stroke-linejoin="round" transform="translate(10, 115)">
      <!-- Letter K -->
      <path d="M75 140 L45 310" stroke-width="16" />
      <path d="M105 175 C85 200, 60 220, 50 225 L115 310" stroke-width="15" />
      <!-- Letter i -->
      <circle cx="130" cy="180" r="7" fill="#0284c7" stroke="none" />
      <path d="M130 205 L120 305" stroke-width="14" />
      <!-- Letter t -->
      <path d="M155 155 L145 305 C145 315, 165 320, 185 300" stroke-width="14" />
      <path d="M135 205 L175 200" stroke-width="12" />
      <!-- Letter o -->
      <path d="M225 210 C190 205, 175 240, 180 275 C185 310, 220 320, 240 285 C255 260, 250 215, 225 210" stroke-width="14" />
      <!-- Letter b -->
      <path d="M245 135 L235 305 C235 305, 265 210, 300 215 C330 220, 330 280, 295 305 C265 325, 245 305, 240 300" stroke-width="15" />
    </g>

  </g>

  <!-- "since 2026" Tagline -->
  <text x="250" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="600" fill="#0369a1" text-anchor="middle" letter-spacing="3">
    since 2026
  </text>
</svg>
